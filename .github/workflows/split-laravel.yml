name: Split Laravel package

on:
    push:
        branches: [main]
        tags: ['v*']
    workflow_dispatch:

jobs:
    split:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Split packages/laravel and push to manadah/data-viewer-php
              env:
                  SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  git subtree split --prefix packages/laravel --branch laravel-split
                  git push "https://x-access-token:${SPLIT_TOKEN}@github.com/manadah/data-viewer-php.git" laravel-split:main --force
                  if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                    git push "https://x-access-token:${SPLIT_TOKEN}@github.com/manadah/data-viewer-php.git" "refs/tags/${GITHUB_REF_NAME}"
                  fi
